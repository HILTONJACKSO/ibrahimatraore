name: Build & Deploy to Hostinger VPS (ibrahimatraore.net)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-verify:
    name: TypeScript & Production Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Build production Next.js bundle
        env:
          NEXT_PUBLIC_SITE_URL: https://ibrahimatraore.net
          NEXT_PUBLIC_VERIFIED_EMAIL: ceo@ibrahimatraore.net
        run: npm run build

  deploy-to-hostinger-vps:
    name: Deploy to Hostinger VPS via SSH
    needs: build-and-verify
    runs-on: ubuntu-latest
    # Runs automatically once VPS_HOST, VPS_USER, and VPS_SSH_KEY secrets are configured in GitHub
    if: ${{ github.ref == 'refs/heads/main' && secrets.VPS_HOST != '' }}
    steps:
      - name: Deploy via SSH to Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/ibrahimatraore.net
            git pull origin main
            npm ci
            npm run build
            pm2 reload ibrahimatraore-web --update-env || pm2 start ecosystem.config.cjs
            pm2 save
