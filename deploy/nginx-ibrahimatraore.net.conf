# ============================================================================
# NGINX PRODUCTION CONFIGURATION — ibrahimatraore.net (Hostinger VPS)
# Place at: /etc/nginx/sites-available/ibrahimatraore.net
# Symlink:  ln -s /etc/nginx/sites-available/ibrahimatraore.net /etc/nginx/sites-enabled/
# Then run: certbot --nginx -d ibrahimatraore.net -d www.ibrahimatraore.net
# ============================================================================

# Redirect www.ibrahimatraore.net -> ibrahimatraore.net
server {
    listen 80;
    listen [::]:80;
    server_name www.ibrahimatraore.net;
    return 301 https://ibrahimatraore.net$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name ibrahimatraore.net;

    # Client upload size & timeouts
    client_max_body_size 10M;
    keepalive_timeout 65;

    # Gzip compression for fast global delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Immutable static assets from Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Self-hosted variable fonts, brand signatures, and executive portraits
    location ~* ^/(fonts|brand|images)/ {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Main Next.js application & /api/contact endpoint
    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
